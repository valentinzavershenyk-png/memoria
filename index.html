<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Герої сучасності — меморіал Героям</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Manrope:wght@400;500&display=swap">
    <style>
        :root { --bg: #000000; --ph: #1a1a1a; --line: #333333; --text: #f0ebd9; --muted: #a09785; --accent: #df9e38; --serif: 'Lora', Georgia, serif; --sans: 'Manrope', system-ui, sans-serif; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 1rem; line-height: 1.6; }
        a { color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
        .bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; position: relative; }
        .logo { font-family: var(--serif); font-size: 1.6rem; text-decoration: none; color: var(--accent); font-weight: 500; }
        .menu { width: 48px; height: 48px; background: none; border: 0; color: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        nav { display: none; position: absolute; top: 100%; left: -20px; right: -20px; background: rgba(0,0,0,0.95); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 20px; z-index: 5; backdrop-filter: blur(10px); }
        nav.open { display: block; }
        nav a { display: block; padding: 14px 0; text-decoration: none; color: var(--muted); font-size: 1.2rem; border-bottom: 1px solid var(--line); transition: color 0.2s; }
        nav a:last-child { border-bottom: 0; }
        nav a:hover { color: var(--text); }
        .hero { max-width: 960px; margin: 0 auto; padding: 50px 20px 60px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .hero-header { display: flex; align-items: center; justify-content: center; gap: 25px; flex-wrap: wrap; }
        .hero h1 { font-family: var(--serif); font-size: 2.8rem; color: var(--accent); margin: 0; line-height: 1.2; }
        .symbol-box { display: flex; align-items: center; gap: 15px; }
        .trident { width: 45px; height: 55px; fill: var(--accent); }
        .candle-svg { width: 35px; height: 55px; }
        .flame { fill: var(--accent); transform-origin: 50% 80%; animation: flicker 0.6s infinite alternate; }
        @keyframes flicker { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1; } }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 35px; padding: 0 20px 80px; max-width: 1200px; margin: 0 auto; }
        .tile { position: relative; cursor: pointer; border-radius: 16px; overflow: hidden; background: var(--ph); border: 1px solid var(--line); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease; }
        .tile:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 0 1px var(--accent); }
        .img-container { position: relative; aspect-ratio: 3/4; overflow: hidden; border-bottom: 1px solid var(--line); }
        .tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .tile video { opacity: 0; transition: opacity 0.4s ease; }
        .tile:hover video { opacity: 1; }
        .info-card { padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
        .name { font-family: var(--sans); font-size: 1.15rem; color: var(--text); font-weight: 500; }
        .years { font-size: 0.9rem; color: var(--muted); }
        #m { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; backdrop-filter: blur(12px); opacity: 0; transition: opacity 0.3s ease; }
        #m.on { display: flex; opacity: 1; }
        .box { background: #111; max-width: 850px; width: 100%; border-radius: 20px; border: 1px solid var(--line); display: flex; gap: 40px; padding: 35px; flex-wrap: wrap; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .box-img-area { width: 280px; max-width: 100%; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .box img { width: 100%; border-radius: 12px; object-fit: cover; aspect-ratio: 3/4; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .info { flex: 1; min-width: 300px; display: flex; flex-direction: column; }
        .info h2 { font-family: var(--serif); color: var(--accent); margin: 0 0 8px; font-size: 2rem; }
        .info .rank { font-weight: 500; font-size: 1.1rem; color: #d4a373; margin-bottom: 16px; }
        .info .story { line-height: 1.8; opacity: 0.95; font-size: 1.05rem; color: var(--text); }
        .controls { display: flex; gap: 15px; flex-wrap: wrap; margin-top: auto; padding-top: 30px; align-items: center; }
        button.act { font-family: var(--sans); background: var(--accent); color: #000; border: 0; border-radius: 10px; padding: 14px 24px; font-size: 1rem; cursor: pointer; transition: transform 0.2s, background 0.2s; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        button.act:hover { background: #e9ab4e; transform: translateY(-2px); }
        button.candle { background: var(--ph); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 14px 24px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        button.candle:hover { background: #222; border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
        button.candle svg { width: 20px; height: 20px; fill: currentColor; }
        button.candle.lit { border-color: var(--accent); color: var(--accent); background: rgba(223, 158, 56, 0.1); }
        #cl { align-self: flex-start; background: none; border: 0; font-size: 2.5rem; cursor: pointer; color: var(--muted); padding: 0; line-height: 1; transition: color 0.2s; }
        #cl:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="bar">
            <a href="index.html" class="logo">Memoria</a>
            <button class="menu" id="menu-btn" aria-label="Меню">☰</button>
            <nav id="nav-menu">
                <a href="wwi.html">Перша світова війна</a>
                <a href="index.html">Герої сучасності</a>
            </nav>
        </header>
        
        <main class="hero">
            <div class="hero-header">
                <div class="symbol-box">
                    <svg class="trident" viewBox="0 0 30 42"><path d="M15 0C6 0 0 4 0 9v3c0 6 6 12 15 15 9-3 15-9 15-15V9c0-5-6-9-15-9zm0 3c7 0 12 3 12 7v1c0 5-6 10-12 12C9 20 3 15 3 11v-1c0-4 5-7 12-7zM6 36h18v3H6zm0-6h18v3H6z"/></svg>
                </div>
                <h1>Герої сучасності</h1>
                <div class="symbol-box">
                    <svg class="candle-svg" viewBox="0 0 30 50">
                        <rect x="12" y="20" width="6" height="25" fill="#555" rx="3"/>
                        <path class="flame" d="M15 18 C10 12 10 5 15 0 C20 5 20 12 15 18 Z"/>
                    </svg>
                </div>
            </div>
            <p>Пам'ять славних воїнів російсько-української війни</p>
        </main>
        
        <div class="grid" id="g"></div>
    </div>

    <!-- Модальне вікно -->
    <div id="m">
        <div class="box">
            <button id="cl" aria-label="Закрити">×</button>
            <div id="md-c"></div>
        </div>
    </div>

    <!-- Фонова музика -->
    <audio id="bg-music" loop src="music.mp3"></audio>

    <script>
        const H = [
            {"id":"darii","name":"Дарій Дмитро Кузьмович","years":"25.10.1971 – 28.10.2018","rank":"Солдат","story":"Дмитро Кузьмович Дарій — справжній патріот, який став на захист України в найскладніші часи. Його мужність та відданість своїй землі навічно залишаться в пам'яті нашого народу."},
            {"id":"nezviskyi","name":"Незвиський Микола Васильович","years":"18.12.1979 – 19.12.2024","rank":"Сержант","story":"Незвиський Микола Васильович — захисник України, сержант Збройних Сил України, житель села Суховерхів. Народився 18 грудня 1979 року. Загинув 19 грудня 2024 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"melnychuk","name":"Мельничук Мирослав Михайлович","years":"25.08.1992 – 29.09.2025","rank":"","story":"Мельничук Мирослав Михайлович — захисник України, житель села Суховерхів. Народився 25 серпня 1992 року. Загинув 29 вересня 2025 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"heshko","name":"Гешко Михайло Іванович","years":"21.11.1995 – 14.02.2026","rank":"","story":"Гешко Михайло Іванович — захисник України, житель села Суховерхів. Народився 21 листопада 1995 року. Загинув 14 лютого 2026 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"pidhoretskyi","name":"Підгорецький Михайло Вікторович","years":"05.03.1985 – 27.01.2025","rank":"Солдат","story":"Підгорецький Михайло Вікторович — захисник України, солдат Збройних Сил України, житель села Суховерхів. Народився 5 березня 1985 року. Загинув 27 січня 2025 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"sukhar","name":"Сухарь Григорій Васильович","years":"09.02.1980 – 10.04.2023","rank":"Солдат","story":"Сухарь Григорій Васильович — захисник України, солдат Збройних Сил України, житель села Суховерхів. Народився 9 лютого 1980 року. Загинув 10 квітня 2023 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"larionov","name":"Ларіонов Олександр Васильович","years":"28.02.1984 – 29.08.2023","rank":"Старший сержант, командир відділення","story":"Ларіонов Олександр Васильович — захисник України, старший сержант, командир відділення Збройних Сил України, житель села Суховерхів. Народився 28 лютого 1984 року. Загинув 29 серпня 2023 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"romanko","name":"Романко Роман Васильович","years":"28.01.1975 – 17.04.2025","rank":"Солдат","story":"Романко Роман Васильович — захисник України, солдат Збройних Сил України, житель села Суховерхів. Народився 28 січня 1975 року. Загинув 17 квітня 2025 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"unhurian","name":"Унгурян Олександр Васильович","years":"09.08.1987 – 22.03.2023","rank":"Старший солдат","story":"Унгурян Олександр Васильович — захисник України, старший солдат Збройних Сил України, житель села Суховерхів. Народився 9 серпня 1987 року. Загинув 22 березня 2023 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"}
        ];

        const candleCounts = {};
        H.forEach(h => candleCounts[h.id] = 0);

        const grid = document.getElementById('g');
        const modal = document.getElementById('m');
        const modalContent = document.getElementById('md-c');
        const closeBtn = document.getElementById('cl');
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        const bgMusic = document.getElementById('bg-music');

        // Автозапуск музики після першого кліку на сторінці
        const startMusic = () => {
            bgMusic.play().catch(e => console.log("Музику заблоковано браузером до взаємодії"));
            document.removeEventListener('click', startMusic);
        };
        document.addEventListener('click', startMusic);

        H.forEach(h => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = `
                <div class="img-container">
                    <img src="${h.id}.jpg" alt="${h.name}">
                    <video loop muted playsinline>
                        <source src="${h.id}-wave.webm" type="video/webm">
                    </video>
                </div>
                <div class="info-card">
                    <b class="name">${h.name}</b>
                    <small class="years">${h.years}</small>
                </div>
            `;

            tile.onmouseenter = () => tile.querySelector('video').play();
            tile.onmouseleave = () => {
                const vid = tile.querySelector('video');
                vid.pause();
                vid.currentTime = 0;
            };

            tile.ontouchstart = () => {
                const vid = tile.querySelector('video');
                vid.play();
                setTimeout(() => { vid.pause(); vid.currentTime = 0; }, 3000);
            };

            tile.onclick = () => {
                // Притихання музики при відкритті вікна
                bgMusic.volume = 0.2;

                modalContent.innerHTML = `
                    <div class="box-img-area">
                        <img src="${h.id}.jpg" alt="${h.name}">
                        <button class="candle" id="light-candle">
                            <svg viewBox="0 0 24 24"><path d="M12 2v6M12 18v4M4.93 4.93l4.24 4.24M14.83 14.83l4.24 4.24M2 12h6M16 12h6M4.93 19.07l4.24-4.24M14.83 9.17l4.24-4.24"/></svg>
                            Запалити свічку <span>(${candleCounts[h.id]})</span>
                        </button>
                    </div>
                    <div class="info">
                        <h2>${h.name}</h2>
                        <div class="rank">${h.rank}</div>
                        <div class="years">${h.years}</div>
                        <div class="story">${h.story}</div>
                        <div class="controls">
                            <button class="act" id="play-story">⏸ Пауза</button>
                        </div>
                        <audio id="hero-audio" src="${h.id}-voice.mp3" autoplay></audio>
                    </div>
                `;
                
                modal.classList.add('on');

                const heroAudio = document.getElementById('hero-audio');
                const playBtn = document.getElementById('play-story');
                const candleBtn = document.getElementById('light-candle');

                let isStoryPlaying = true;

                playBtn.onclick = () => {
                    if (isStoryPlaying) {
                        heroAudio.pause();
                        playBtn.textContent = '▶ Прослухати історію';
                    } else {
                        heroAudio.play();
                        playBtn.textContent = '⏸ Пауза';
                    }
                    isStoryPlaying = !isStoryPlaying;
                };

                heroAudio.onended = () => {
                    playBtn.textContent = '▶ Прослухати історію';
                    isStoryPlaying = false;
                };

                candleBtn.onclick = () => {
                    candleCounts[h.id]++;
                    candleBtn.querySelector('span').textContent = `(${candleCounts[h.id]})`;
                    candleBtn.classList.add('lit');
                };
            };

            const closeModal = () => {
                const heroAudio = document.getElementById('hero-audio');
                if (heroAudio) heroAudio.pause();
                // Повернення гучності музики при закритті
                bgMusic.volume = 1.0;
                modal.classList.remove('on');
            };

            closeBtn.onclick = closeModal;
            modal.onclick = e => { if (e.target === modal) closeModal(); };

            grid.appendChild(tile);
        });

        menuBtn.onclick = () => navMenu.classList.toggle('open');
        window.onclick = e => { if (!menuBtn.contains(e.target) && !navMenu.contains(e.target)) navMenu.classList.remove('open'); };
    </script>
</body>
</html>
