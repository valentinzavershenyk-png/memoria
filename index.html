<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Герої сучасності — меморіал Героям</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Manrope:wght@400;500&display=swap">
    <style>
        :root { --bg: #000000; --ph: #26201A; --line: #3A322A; --text: #EDE6DA; --muted: #BDB2A2; --accent: #E0A458; --serif: 'Lora', Georgia, serif; --sans: 'Manrope', system-ui, sans-serif; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 1rem; line-height: 1.6; }
        a { color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
        .bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; position: relative; }
        .logo { font-family: var(--serif); font-size: 1.5rem; text-decoration: none; color: var(--accent); }
        .menu { width: 44px; height: 44px; background: none; border: 0; color: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        nav { display: none; position: absolute; top: 100%; left: -20px; right: -20px; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 20px; z-index: 5; }
        nav.open { display: block; }
        nav a { display: block; padding: 12px 0; text-decoration: none; color: var(--muted); font-size: 1.1rem; }
        nav a:hover { color: var(--text); }
        .hero { max-width: 880px; margin: 0 auto; padding: 40px 20px 48px; text-align: center; }
        .hero h1 { font-family: var(--serif); font-size: 2.5rem; color: var(--accent); margin: 0 0 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; padding: 0 20px 60px; max-width: 1200px; margin: 0 auto; }
        .tile { position: relative; cursor: pointer; border-radius: 12px; overflow: hidden; aspect-ratio: 3/4; background: var(--ph); border: 1px solid var(--line); transition: transform 0.3s ease; }
        .tile:hover { transform: translateY(-5px); }
        .tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .tile video { opacity: 0; transition: opacity 0.4s ease; }
        .tile:hover video, .tile.live video { opacity: 1; }
        .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; background: linear-gradient(transparent, rgba(0, 0, 0, 0.85)); }
        .cap b { display: block; font-family: var(--sans); font-size: 1.1rem; color: var(--accent); }
        .cap small { display: block; font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
        #m { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; backdrop-filter: blur(8px); }
        #m.on { display: flex; }
        .box { background: var(--ph); max-width: 800px; width: 100%; border-radius: 16px; border: 1px solid var(--line); display: flex; gap: 30px; padding: 30px; flex-wrap: wrap; max-height: 90vh; overflow-y: auto; }
        .box img { width: 260px; max-width: 100%; border-radius: 8px; object-fit: cover; height: 350px; }
        .info { flex: 1; min-width: 250px; display: flex; flex-direction: column; }
        .info h2 { font-family: var(--serif); color: var(--accent); margin: 0 0 10px; font-size: 1.8rem; }
        .info .rank { font-weight: 500; color: var(--accent); }
        .info .years { color: var(--muted); margin: 4px 0 16px; }
        .info .story { line-height: 1.7; opacity: 0.95; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 20px; }
        button.act { font-family: var(--sans); background: var(--accent); color: #000; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 1rem; cursor: pointer; transition: background 0.2s; font-weight: 500; }
        button.act:hover { background: #E6B579; }
        button.g { background: var(--line); color: var(--text); border: 0; border-radius: 8px; padding: 12px 20px; cursor: pointer; transition: background 0.2s; }
        button.g:hover { background: #4D4338; }
        #cl { align-self: flex-start; background: none; border: 0; font-size: 2rem; cursor: pointer; color: var(--muted); }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="bar">
            <a href="index.html" class="logo">Memoria</a>
            <button class="menu" id="menu-btn" aria-label="Меню">☰</button>
            <nav id="nav-menu">
                <a href="wwi.html">Перша світова війна</a>
                <a href="wwii.html">Друга світова війна</a>
                <a href="index.html">Герої сучасності</a>
            </nav>
        </header>
        <main class="hero">
            <h1>Герої сучасності</h1>
            <p>Пам'ять славних воїнів російсько-української війни</p>
        </main>
        <div class="grid" id="g"></div>
    </div>

    <!-- Модальне вікно -->
    <div id="m">
        <div class="box">
            <button id="cl" aria-label="Закрити">×</button>
            <div id="md-c"></div>
        </div>
    </div>

    <!-- Тут мають бути ваші скрипти -->
    <script src="path/to/your/script.js"></script>
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        menuBtn.onclick = () => navMenu.classList.toggle('open');
        window.onclick = e => { if (!menuBtn.contains(e.target) && !navMenu.contains(e.target)) navMenu.classList.remove('open'); };
    </script>
</body>
</html>
