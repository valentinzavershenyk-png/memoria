<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Герої сучасності — меморіал Героям</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Manrope:wght@400;500&display=swap">
    <style>
        :root { --bg: #000000; --ph: #26201A; --line: #3A322A; --text: #EDE6DA; --muted: #BDB2A2; --accent: #E0A458; --serif: 'Lora', Georgia, serif; --sans: 'Manrope', system-ui, sans-serif; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 1rem; line-height: 1.6; }
        a { color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
        .bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; position: relative; }
        .logo { font-family: var(--serif); font-size: 1.5rem; text-decoration: none; color: var(--accent); }
        .menu { width: 44px; height: 44px; background: none; border: 0; color: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        nav { display: none; position: absolute; top: 100%; left: -20px; right: -20px; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 20px; z-index: 5; }
        nav.open { display: block; }
        nav a { display: block; padding: 12px 0; text-decoration: none; color: var(--muted); font-size: 1.1rem; }
        nav a:hover { color: var(--text); }
        .hero { max-width: 880px; margin: 0 auto; padding: 40px 20px 48px; text-align: center; }
        .hero h1 { font-family: var(--serif); font-size: 2.5rem; color: var(--accent); margin: 0 0 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 40px; padding: 0 20px 60px; max-width: 1200px; margin: 0 auto; }
        .tile { position: relative; cursor: pointer; border-radius: 12px; overflow: hidden; background: transparent; transition: transform 0.3s ease; }
        .tile:hover { transform: translateY(-5px); }
        .img-container { position: relative; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
        .tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .tile video { opacity: 0; transition: opacity 0.4s ease; }
        .tile:hover video { opacity: 1; }
        .info-card { margin-top: 16px; text-align: center; }
        .name { display: block; font-family: var(--sans); font-size: 1.1rem; color: var(--text); font-weight: 500; }
        .years { display: block; font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
        #m { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; backdrop-filter: blur(8px); }
        #m.on { display: flex; }
        .box { background: var(--ph); max-width: 800px; width: 100%; border-radius: 16px; border: 1px solid var(--line); display: flex; gap: 30px; padding: 30px; flex-wrap: wrap; max-height: 90vh; overflow-y: auto; }
        .box img { width: 260px; max-width: 100%; border-radius: 8px; object-fit: cover; height: 350px; }
        .info { flex: 1; min-width: 250px; display: flex; flex-direction: column; }
        .info h2 { font-family: var(--serif); color: var(--accent); margin: 0 0 10px; font-size: 1.8rem; }
        .info .rank { font-weight: 500; color: var(--accent); }
        .info .years { color: var(--muted); margin: 4px 0 16px; font-size: 1rem; }
        .info .story { line-height: 1.7; opacity: 0.95; }
        .controls { display: flex; gap: 15px; flex-wrap: wrap; margin-top: auto; padding-top: 20px; align-items: center; }
        button.act { font-family: var(--sans); background: var(--accent); color: #000; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 1rem; cursor: pointer; transition: background 0.2s; font-weight: 500; }
        button.act:hover { background: #E6B579; }
        button.candle { background: var(--line); color: var(--text); border: 0; border-radius: 8px; padding: 12px 20px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        button.candle:hover { background: #4D4338; }
        #cl { align-self: flex-start; background: none; border: 0; font-size: 2rem; cursor: pointer; color: var(--muted); padding: 0; }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="bar">
            <a href="index.html" class="logo">Memoria</a>
            <button class="menu" id="menu-btn" aria-label="Меню">☰</button>
            <nav id="nav-menu">
                <a href="wwi.html">Перша світова війна</a>
                <a href="index.html">Герої сучасності</a>
            </nav>
        </header>
        <main class="hero">
            <h1>Герої сучасності</h1>
            <p>Пам'ять славних воїнів російсько-української війни</p>
        </main>
        <div class="grid" id="g"></div>
    </div>

    <!-- Модальне вікно -->
    <div id="m">
        <div class="box">
            <button id="cl" aria-label="Закрити">×</button>
            <div id="md-c"></div>
        </div>
    </div>

    <!-- Фонова музика -->
    <audio id="bg-music" loop src="music.mp3"></audio>

    <script>
        const H = [
            {"id":"darii","name":"Дарій Дмитро Кузьмович","years":"25.10.1971 – 28.10.2018","rank":"Солдат","story":"Дмитро Кузьмович Дарій — справжній патріот, який став на захист України в найскладніші часи. Його мужність та відданість своїй землі навічно залишаться в пам'яті нашого народу."},
            {"id":"nezviskyi","name":"Незвиський Микола Васильович","years":"18.12.1979 – 19.12.2024","rank":"Сержант","story":"Незвиський Микола Васильович — захисник України, сержант Збройних Сил України, житель села Суховерхів. Народився 18 грудня 1979 року. Загинув 19 грудня 2024 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"melnychuk","name":"Мельничук Мирослав Михайлович","years":"25.08.1992 – 29.09.2025","rank":"","story":"Мельничук Мирослав Михайлович — захисник України, житель села Суховерхів. Народився 25 серпня 1992 року. Загинув 29 вересня 2025 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"heshko","name":"Гешко Михайло Іванович","years":"21.11.1995 – 14.02.2026","rank":"","story":"Гешко Михайло Іванович — захисник України, житель села Суховерхів. Народився 21 листопада 1995 року. Загинув 14 лютого 2026 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"pidhoretskyi","name":"Підгорецький Михайло Вікторович","years":"05.03.1985 – 27.01.2025","rank":"Солдат","story":"Підгорецький Михайло Вікторович — захисник України, солдат Збройних Сил України, житель села Суховерхів. Народився 5 березня 1985 року. Загинув 27 січня 2025 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"sukhar","name":"Сухарь Григорій Васильович","years":"09.02.1980 – 10.04.2023","rank":"Солдат","story":"Сухарь Григорій Васильович — захисник України, солдат Збройних Сил України, житель села Суховерхів. Народився 9 лютого 1980 року. Загинув 10 квітня 2023 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"larionov","name":"Ларіонов Олександр Васильович","years":"28.02.1984 – 29.08.2023","rank":"Старший сержант, командир відділення","story":"Ларіонов Олександр Васильович — захисник України, старший сержант, командир відділення Збройних Сил України, житель села Суховерхів. Народився 28 лютого 1984 року. Загинув 29 серпня 2023 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"romanko","name":"Романко Роман Васильович","years":"28.01.1975 – 17.04.2025","rank":"Солдат","story":"Романко Роман Васильович — захисник України, солдат Збройних Сил України, житель села Суховерхів. Народився 28 січня 1975 року. Загинув 17 квітня 2025 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"},
            {"id":"unhurian","name":"Унгурян Олександр Васильович","years":"09.08.1987 – 22.03.2023","rank":"Старший солдат","story":"Унгурян Олександр Васильович — захисник України, старший солдат Збройних Сил України, житель села Суховерхів. Народився 9 серпня 1987 року. Загинув 22 березня 2023 року, захищаючи Україну від російського агресора. Вічна пам'ять і слава Герою!"}
        ];

        const candleCounts = {};
        H.forEach(h => candleCounts[h.id] = 0);

        const grid = document.getElementById('g');
        const modal = document.getElementById('m');
        const modalContent = document.getElementById('md-c');
        const closeBtn = document.getElementById('cl');
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        const bgMusic = document.getElementById('bg-music');

        // Автозапуск музики після першого кліку на сторінці
        const startMusic = () => {
            bgMusic.play().catch(e => console.log("Музику заблоковано браузером до взаємодії"));
            document.removeEventListener('click', startMusic);
        };
        document.addEventListener('click', startMusic);

        H.forEach(h => {
             const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = `
                <div class="img-container">
                    <img src="${h.id}.jpg" alt="${h.name}">
                    <video loop muted playsinline>
                        <source src="${h.id}-wave.webm" type="video/webm">
                    </video>
                </div>
                <div class="info-card">
                    <b class="name">${h.name}</b>
                    <small class="years">${h.years}</small>
                </div>
            `;

            tile.onmouseenter = () => tile.querySelector('video').play();
            tile.onmouseleave = () => {
                const vid = tile.querySelector('video');
                vid.pause();
                vid.currentTime = 0;
            };

            tile.ontouchstart = () => {
                const vid = tile.querySelector('video');
                vid.play();
                setTimeout(() => { vid.pause(); vid.currentTime = 0; }, 3000);
            };

            tile.onclick = () => {
                modalContent.innerHTML = `
                    <div style="text-align: center;">
                        <img src="${h.id}.jpg" alt="${h.name}" style="width: 100%; max-width: 300px; border-radius: 8px;">
                    </div>
                    <div class="info">
                        <h2>${h.name}</h2>
                        <div class="rank">${h.rank}</div>
                        <div class="years">${h.years}</div>
                        <div class="story">${h.story}</div>
                        <div class="controls">
                            <button class="act" id="play-story">⏸️ Пауза</button>
                            <button class="candle" id="light-candle">🕯️ Запалити свічку <span>(${candleCounts[h.id]})</span></button>
                        </div>
                        <audio id="hero-audio" src="${h.id}-voice.mp3" autoplay></audio>
                    </div>
                `;
                
                modal.classList.add('on');

                const heroAudio = document.getElementById('hero-audio');
                const playBtn = document.getElementById('play-story');
                const candleBtn = document.getElementById('light-candle');

                let isStoryPlaying = true;

                playBtn.onclick = () => {
                    if (isStoryPlaying) {
                        heroAudio.pause();
                        playBtn.textContent = '▶ Прослухати історію';
                    } else {
                        heroAudio.play();
                        playBtn.textContent = '⏸️ Пауза';
                    }
                    isStoryPlaying = !isStoryPlaying;
                };

                heroAudio.onended = () => {
                    playBtn.textContent = '▶ Прослухати історію';
                    isStoryPlaying = false;
                };

                candleBtn.onclick = () => {
                    candleCounts[h.id]++;
                    candleBtn.querySelector('span').textContent = `(${candleCounts[h.id]})`;
                };
            };

            grid.appendChild(tile);
        });

        closeBtn.onclick = () => {
            const heroAudio = document.getElementById('hero-audio');
            if (heroAudio) heroAudio.pause();
            modal.classList.remove('on');
        };
        
        modal.onclick = e => {
            if (e.target === modal) {
                const heroAudio = document.getElementById('hero-audio');
                if (heroAudio) heroAudio.pause();
                modal.classList.remove('on');
            }
        };
        
        menuBtn.onclick = () => navMenu.classList.toggle('open');
        window.onclick = e => { if (!menuBtn.contains(e.target) && !navMenu.contains(e.target)) navMenu.classList.remove('open'); };
    </script>
</body>
</html>
